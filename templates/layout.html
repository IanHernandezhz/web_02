
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }} | Biblioteca Universitaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="holiday-body">
    <nav class="navbar navbar-expand-lg holiday-navbar">
        <div class="container-fluid">
            <a class="navbar-brand holiday-brand" href="{{ url_for('home') }}">
                Biblioteca Universitaria
            </a>
            <div class="navbar-nav holiday-nav-list ms-auto">
                <a class="nav-link holiday-link" href="{{ url_for('home') }}">
                    Inicio
                </a>
                <a class="nav-link holiday-link" href="{{ url_for('catalogo') }}">
                    Catálogo
                </a>
                <a class="nav-link holiday-link" href="{{ url_for('servicios') }}">
                    Servicios
                </a>
                <a class="nav-link holiday-link" href="{{ url_for('contacto') }}">
                    Contacto
                </a>
            </div>
        </div>
    </nav>
    <div class="container main-layout-container">
        <main class="holiday-content-card">
            <!-- Detalle de la araña colgando en la esquina superior derecha -->
            <div class="spider-web-corner"></div>
            
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
 </html>
